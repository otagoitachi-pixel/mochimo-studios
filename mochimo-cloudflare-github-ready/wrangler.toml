name = "mochimo-studios"
main = "src/worker.js"
compatibility_date = "2026-09-15"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/u/*", "/q/*", "/n/*"]

[[d1_databases]]
binding = "DB"
database_name = "mochimo-db"
database_id = "00000000-0000-0000-0000-000000000000"
